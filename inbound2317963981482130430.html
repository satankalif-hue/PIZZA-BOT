<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizza dla załogi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe4e7;--ticket:#ffffff;--ink:#1d2528;--mute:#68757a;--red:#c8352b;--green:#2f6b3f;--line:#c4cdd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2124;--ticket:#283135;--ink:#eef2f3;--mute:#9aa8ad;--red:#ff6a5c;--green:#6fcf8a;--line:#3a464b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.5px}
.count{color:var(--mute);font-size:15px}
.ticket{background:var(--ticket);border-radius:4px;padding:14px 14px 14px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:center;border-left:8px solid var(--line);position:relative}
.ticket.asap{border-left-color:var(--red)}
.ticket.done{opacity:.55;border-left-color:var(--green)}
.ticket.done .pizza{text-decoration:line-through}
.info{flex:1;min-width:0}
.when{font-weight:800;font-size:15px;color:var(--ink)}
.asap .when{color:var(--red)}
.pizza{font-size:20px;font-weight:600;margin:2px 0}
.who{color:var(--mute);font-size:15px}
.note{font-size:14px;color:var(--mute);margin-top:2px}
.check{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink);background:none;color:var(--ink);font-size:30px;cursor:pointer;flex:none}
.done .check{background:var(--green);border-color:var(--green);color:#fff}
.check:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.sep{font-size:14px;color:var(--mute);margin:20px 0 8px}
.sim{background:var(--ticket);border-radius:4px;padding:14px;margin-top:26px}
.sim h2{font-size:17px;margin:0 0 4px}
.sim p{font-size:14px;color:var(--mute);margin:0 0 10px}
.row{display:flex;gap:8px;margin-bottom:8px}
input{font:inherit;padding:12px;border:2px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.row input:first-child{max-width:130px}
.send{font:inherit;font-weight:800;padding:12px 16px;border:0;border-radius:4px;background:var(--red);color:#fff;cursor:pointer}
.bot{font-size:14px;margin-top:8px;padding:10px;border-radius:4px;background:var(--bg);display:none}
.toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;background:var(--ink);color:var(--bg);padding:14px;border-radius:4px;display:none;font-weight:600}
</style>
</head>
<body>
<main>
<header><h1>Pizza dla załogi</h1><span class="count" id="count"></span></header>
<div id="list"></div>

</main>
<div class="toast" id="toast" role="status"></div>

<script>
var orders=[],seen=null,KEY=new URLSearchParams(location.search).get("key")||"";
try{if(KEY)localStorage.setItem("pizza-key",KEY);else KEY=localStorage.getItem("pizza-key")||""}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function card(o){return '<div class="ticket'+(o.time=="ASAP"?" asap":"")+(o.done?" done":"")+'"><div class="info"><div class="when">'+(o.time=="ASAP"?"ASAP":"na "+esc(o.time))+'</div><div class="pizza">'+esc(o.pizza)+'</div><div class="who">'+esc(o.who)+'</div>'+(o.note?'<div class="note">'+esc(o.note)+'</div>':"")+'</div><button class="check" data-id="'+o.id+'" aria-label="'+(o.done?"Cofnij":"Oznacz jako gotowe")+'">\u2713</button></div>'}
function render(){
 var open=orders.filter(function(o){return !o.done}),done=orders.filter(function(o){return o.done});
 open.sort(function(a,b){var aa=a.time=="ASAP",ba=b.time=="ASAP";if(aa!=ba)return aa?-1:1;if(aa)return a.t-b.t;return a.time<b.time?-1:a.time>b.time?1:0});
 var h=open.map(card).join("")||'<div class="empty">Brak zam\u00f3wie\u0144. Odpocznij.</div>';
 if(done.length)h+='<div class="sep">Gotowe ('+done.length+')</div>'+done.slice(-5).reverse().map(card).join("");
 document.getElementById("list").innerHTML=h;
 document.getElementById("count").textContent=open.length+" do zrobienia";
 Array.prototype.forEach.call(document.querySelectorAll(".check"),function(b){b.onclick=function(){toggle(+b.dataset.id)}})}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display="none"},3200)}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.25)}catch(e){}
 if(navigator.vibrate)try{navigator.vibrate(250)}catch(e){}}
function toggle(id){var o=orders.filter(function(x){return x.id==id})[0];if(!o)return;
 fetch("/api/orders/"+id+"/done?key="+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({done:!o.done})})
 .then(function(r){if(!r.ok)throw 0;if(!o.done)toast("Bot napisa\u0142 do: "+o.who.split(" ")[0])}).catch(function(){toast("Nie uda\u0142o si\u0119. Sprawd\u017a po\u0142\u0105czenie i klucz.")})}
function connect(){var es=new EventSource("/api/stream?key="+encodeURIComponent(KEY));
 es.onmessage=function(e){var list=JSON.parse(e.data),ids=list.map(function(o){return o.id});
  if(seen&&ids.some(function(i){return seen.indexOf(i)<0}))beep();
  seen=ids;orders=list;render()};
 es.onerror=function(){document.getElementById("count").textContent="brak po\u0142\u0105czenia\u2026"}}
render();connect();
</script>
</body>
</html>
